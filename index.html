<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="/files/index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoToday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Stack+Sans+Headline:wght@200..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- header  -->
    <header>
        <nav class="navbar">
            <div class="logo"><a href="#">Go<span>Today</span></a></div>

            <!-- Hidden Checkbox -->
            <input type="checkbox" id="menu-toggle">

            <!-- Hamburger -->
            <label for="menu-toggle" class="menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <!-- Menu -->
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Destination</a>
                <a href="#">Tour</a>
                <a href="#">Blog</a>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main>
        <!-- HERO SECTION -->
        <section class="hero">
            <div class="hero-container">
                <!-- Left Side -->
                <div class="hero-content">

                    <p class="hero-tagline">Explore The World</p>

                    <h1>
                        Start Your <span>Dream Journey</span>
                        With Confidence
                    </h1>

                    <p class="hero-text">
                        Discover beautiful destinations, travel smarter,
                        and create unforgettable memories with us.
                    </p>

                    <div class="hero-buttons">
                        <a href="#" class="btn-primary">Get Started</a>
                        <a href="#" class="btn-secondary">Learn More</a>
                    </div>
                </div>

                <!-- Right Side -->
                <div class="hero-image">
                    <img src="images/traveler.jpg" alt="Traveler">
                </div>

            </div>

        </section>
    </main>
</body>

</html>
